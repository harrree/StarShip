{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | MOVUE</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <script defer src="{% static 'js/profile.js' %}"></script>
</head>
<body class="dark-theme">

    {% include 'header.html' %}

    <div class="container mt-5">
        <!-- Profile Section -->
        <div class="profile-card">
            <img src="{% static 'images/dp.png' %}" alt="Profile Picture" class="profile-pic">
            <h2 class="username">{{ user.username }}</h2>
            <p class="email">{{ user.email }}</p>
             
             <div class="buttons">
                <button class="btn edit-btn" onclick="openEditProfile()">Edit Profile</button>
                <a href="{% url 'userlogout' %}" class="btn logout-btn">Logout</a>
            </div>
        </div>
        

        <!-- Watchlist Section -->
        <section class="movies-section">
            <h2>📌 <a href="{% url 'vwatchlist' %}">Watchlist</a> </h2>
            <div class="carousel-container">
                <div class="carousel">
                    {% for movi in movie %}
                        <div class="carousel-item" onclick="window.location.href='{% url 'information' movi.movieid %}'">
                            <img src="{{ movi.poster.url }}" alt="{{ movi.title }}">
                            <div class="overlay">
                                <h5 class="movie-title">{{ movi.title }}</h5>
                            </div>
                        </div>
                    {% endfor %}
                </div>
                <button class="carousel-btn prev" onclick="prevSlide('watchlist')">&#10094;</button>
                <button class="carousel-btn next" onclick="nextSlide('watchlist')">&#10095;</button>
            </div>
        </section>

        <!-- Reviewed Movies Section -->
        <section class="movies-section">
            <h2>⭐  <a href="{% url 'reviewlist' %}">Reviewlist</a></h2>
            <div class="carousel-container">
                <div class="carousel">
                  
                    {% for movie in reviews %}
                        <div class="carousel-item" onclick="window.location.href='{% url 'information' movie.movieid %}'">
                            <img src="{{ movie.poster.url }}" alt="{{ movie.title }}">
                            <div class="overlay">
                                <h5 class="movie-title">{{ movie.title }}</h5>
                                
                            </div>
                        </div>
                    {% endfor %}
                </div>
                <button class="carousel-btn prev" onclick="prevSlide('reviewed')">&#10094;</button>
                <button class="carousel-btn next" onclick="nextSlide('reviewed')">&#10095;</button>
            </div>
        </section>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal" id="editProfileModal">
        <div class="modal-content">
            <h2>Edit Profile</h2>
            <form method="post" action="{% url 'userlogin' %}">
                {% csrf_token %}
                <label>Username (Once in 14 days):</label>
                <input type="text" name="username" value="{{ user.username }}" {% if user.username_changed_recently %}disabled{% endif %}>

                <label>First Name:</label>
                <input type="text" name="first_name" value="{{ user.first_name }}">

                <label>Last Name:</label>
                <input type="text" name="last_name" value="{{ user.last_name }}">

                <label>Email:</label>
                <input type="email" name="email" value="{{ user.email }}">

                <label>New Password:</label>
                <input type="password" name="password" placeholder="Leave blank to keep current">

                <button type="submit" class="btn save-btn">Save Changes</button>
                <button type="button" class="btn close-btn" onclick="closeEditProfile()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
